<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nectflix - Sign Up Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
    <nav>
        <img src="images/logo.png" alt="Nectflix Logo" class="logo">
        <div>
            <button class="lang-btn"><img src="images/icons/translate.png" alt="Language Icon" height="19">English<img src="images/icons/down.png" alt="Language Icon" height="19"></button>
            <button class="sign-in-btn">Sign In</button>
        </div>
    </nav>

    <div class="header-content">
        <h1>Enter your info</h1>
        <h2>To create an account.</h2>

        <form id="signup-form" class="input-group">
            <input type="text" id="fullName" placeholder="Full Name" required>
            <input type="text" id="username" placeholder="Username" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="get-started-btn">Sign Up</button>
        </form>

        <p class="signup-text">
            Already have an account? <a href="login.html">Sign in</a>
        </p>
    </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyCKk1raVH_Ra0TCfPvcpAODpTEfHxbCil0",
    authDomain: "nectflix-36203.firebaseapp.com",
    databaseURL: "https://nectflix-36203-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "nectflix-36203",
    storageBucket: "nectflix-36203.firebasestorage.app",
    messagingSenderId: "1001197354003",
    appId: "1:1001197354003:web:c76ef922f6a8408fff13e6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const form = document.getElementById("signup-form");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const fullName = document.getElementById("fullName").value.trim();
  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!fullName || !username || !email || !password) {
    return alert("All fields are required");
  }

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    
    await set(ref(db, `users/${user.uid}`), {
      fullName,
      username,
      email,
      profilePic: "images/profile.png",
      createdAt: Date.now()
    });

    alert("Account created successfully!");
    window.location.href = "login.html";
  } catch (err) {
    console.error(err);
    alert(err.message);
  }
});
</script>
</body>
</html>
