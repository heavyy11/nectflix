<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nectflix - Login Page</title>
    <link rel="stylesheet" href="style.css">    
</head>
<body>
<div class="header">
    <nav>
        <img src="images/logo.png" alt="Nectflix Logo" class="logo">
        <div>
            <button class="lang-btn"><img src="images/icons/translate.png" alt="Language Icon" height="19">English<img src="images/icons/down.png" alt="Language Icon" height="19"></button>
            <button class="sign-in-btn">Sign In</button>
        </div>
    </nav>

    <div class="header-content">
        <h1>Enter your info to sign in</h1>
        <h2>Or get started with a new account.</h2>
        
        <form id="login-form" class="input-group">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="get-started-btn">Sign In</button>
        </form>

        <p class="signup-text">
            New to Netflix? <a href="signup.html">Sign up now</a>
        </p>
    </div>
</div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCKk1raVH_Ra0TCfPvcpAODpTEfHxbCil0",
        authDomain: "nectflix-36203.firebaseapp.com",
        projectId: "nectflix-36203",
        storageBucket: "nectflix-36203.firebasestorage.app",
        messagingSenderId: "1001197354003",
        appId: "1:1001197354003:web:c76ef922f6a8408fff13e6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("login-form");
    form.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        signInWithEmailAndPassword(auth, email, password)
            .then(() => {
                window.location.href = "index.html"; 
            })
            .catch(() => {
                alert("No account found. Please sign up.");
            });
    });
</script>
</body>
</html>
